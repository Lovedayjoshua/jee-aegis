services:
  - type: web
    name: jee-aegis-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "https://jee-aegis-mv4i-roan.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: DEVICE_ONLINE_THRESHOLD_SECONDS
        value: "90"
      - key: FCM_SERVER_KEY
        sync: false
