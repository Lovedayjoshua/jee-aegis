name: JEE AEGIS Android APK Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish compiled APK to the apk-latest GitHub Release"
        required: false
        default: "true"
        type: string
  push:
    branches:
      - master
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package JEE AEGIS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK (Signed Release if secrets configured, else Debug)
        id: gradle_build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            export ANDROID_KEYSTORE_PATH="$PWD/release-keystore.jks"
            ./gradlew assembleRelease --stacktrace
            rm -f release-keystore.jks
            echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --stacktrace
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify APK & Prepare Artifact
        id: verify_apk
        run: |
          APK_SOURCE="${{ steps.gradle_build.outputs.apk_path }}"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Expected APK not found at $APK_SOURCE"
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s "$APK_SOURCE")
          if [ "$SIZE_BYTES" -le 0 ]; then
            echo "::error::Generated APK at $APK_SOURCE is empty (0 bytes)."
            exit 1
          fi

          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / (1024 * 1024)}")

          mkdir -p public/downloads
          cp "$APK_SOURCE" public/downloads/jee-aegis.apk

          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

          {
            echo "## JEE AEGIS Android APK Build Summary"
            echo "- **Status**: Build Succeeded (${{ steps.gradle_build.outputs.variant }})"
            echo "- **Source APK**: \`$APK_SOURCE\`"
            echo "- **Artifact Name**: \`JEE-AEGIS-apk\` (\`jee-aegis.apk\`)"
            echo "- **Size**: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JEE-AEGIS-apk
          path: public/downloads/jee-aegis.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK to GitHub Release (apk-latest)
        if: github.event.inputs.publish_release != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" public/downloads/jee-aegis.apk#JEE-AEGIS.apk --clobber
          else
            gh release create "$TAG" public/downloads/jee-aegis.apk#JEE-AEGIS.apk \
              --title "JEE AEGIS Android Connector APK" \
              --notes "Automated JEE AEGIS Android Connector APK (${{ steps.gradle_build.outputs.variant }}, ${{ steps.verify_apk.outputs.size_mb }} MB)."
          fi

      - name: Collect Build Failure Diagnostics
        if: failure()
        run: |
          echo "::warning::Android APK build failed. Inspecting Gradle reports..."
          find android -name "*.txt" -o -name "*.html" | grep "build/reports" || true
