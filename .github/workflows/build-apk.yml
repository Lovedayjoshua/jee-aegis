name: JEE AEGIS Android APK Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish compiled APK to the apk-latest GitHub Release ('true' or 'false')"
        required: false
        default: "true"
        type: string
  push:
    branches:
      - master
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package JEE AEGIS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK (API 35 & Build-Tools 35.0.0)
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            FOUND_SM="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
            if [ -n "$FOUND_SM" ] && [ -x "$FOUND_SM" ]; then
              SDKMANAGER="$FOUND_SM"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android SDK Command-Line Tools..."
            CMDLINE_ZIP="/tmp/commandlinetools-linux.zip"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$CMDLINE_ZIP"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q -o "$CMDLINE_ZIP" -d "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -f "$CMDLINE_ZIP"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android Debug Keystore for Consistent Debug Signing
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jee-aegis-debug-keystore-v1

      - name: Ensure Deterministic Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure & Validate Firebase (google-services.json)
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "firebase_enabled=true" >> "$GITHUB_OUTPUT"
            echo "firebase_status=Firebase-Enabled (google-services.json injected via GOOGLE_SERVICES_JSON_BASE64)" >> "$GITHUB_OUTPUT"
            echo "Injected android/app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "firebase_enabled=true" >> "$GITHUB_OUTPUT"
            echo "firebase_status=Firebase-Enabled (google-services.json injected via GOOGLE_SERVICES_JSON)" >> "$GITHUB_OUTPUT"
            echo "Injected android/app/google-services.json from GOOGLE_SERVICES_JSON secret."
          else
            echo "firebase_enabled=false" >> "$GITHUB_OUTPUT"
            echo "firebase_status=NON-FIREBASE BUILD (No google-services.json — HTTPS Pull-Queue Fallback Only, FCM Push Disabled)" >> "$GITHUB_OUTPUT"
            echo "::warning title=Firebase Configuration Absent::Neither GOOGLE_SERVICES_JSON_BASE64 nor GOOGLE_SERVICES_JSON secret is configured. Building a NON-FIREBASE debug APK (HTTPS pull-queue fallback only; FCM push wakeup disabled)."
          fi

      - name: Build Android APK (Signed Release if secrets configured, else Debug)
        id: gradle_build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            export ANDROID_KEYSTORE_PATH="$PWD/release-keystore.jks"
            ./gradlew assembleRelease --stacktrace
            rm -f release-keystore.jks
            echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --stacktrace
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up temporary CI credentials
        if: always()
        run: |
          rm -f android/release-keystore.jks
          rm -f android/app/google-services.json

      - name: Verify APK & Prepare Artifact
        id: verify_apk
        run: |
          set -euo pipefail
          APK_SOURCE="${{ steps.gradle_build.outputs.apk_path }}"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Expected APK not found at $APK_SOURCE"
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s "$APK_SOURCE")
          if [ "$SIZE_BYTES" -le 0 ]; then
            echo "::error::Generated APK at $APK_SOURCE is empty (0 bytes)."
            exit 1
          fi

          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / (1024 * 1024)}")
          SHA256=$(sha256sum "$APK_SOURCE" | awk '{print $1}')
          COMMIT_SHA="${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"

          VERSION_CODE=$(grep -E 'versionCode\s*=' android/app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          VERSION_NAME=$(grep -E 'versionName\s*=' android/app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE="${VERSION_CODE:-3}"
          VERSION_NAME="${VERSION_NAME:-1.2.0}"

          FB_ENABLED="${{ steps.firebase_config.outputs.firebase_enabled }}"
          FB_STATUS="${{ steps.firebase_config.outputs.firebase_status }}"
          VARIANT="${{ steps.gradle_build.outputs.variant }}"

          if [ "$FB_ENABLED" = "true" ]; then
            BUILD_LABEL="${VARIANT}-firebase-enabled"
          else
            BUILD_LABEL="${VARIANT}-non-firebase-fallback"
          fi

          if [ "$VARIANT" = "release" ]; then
            SIGNING_MODE="Release Keystore (ANDROID_KEYSTORE_BASE64)"
          else
            SIGNING_MODE="Cached CI Debug Keystore (~/.android/debug.keystore)"
          fi

          SHOULD_PUBLISH="false"
          INPUT_PUB="$(echo "${{ github.event.inputs.publish_release }}" | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && { [ "$INPUT_PUB" = "true" ] || [ "$INPUT_PUB" = "1" ] || [ "$INPUT_PUB" = "yes" ]; }; then
            SHOULD_PUBLISH="true"
          fi

          mkdir -p public/downloads
          cp "$APK_SOURCE" public/downloads/jee-aegis.apk

          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_label=$BUILD_LABEL" >> "$GITHUB_OUTPUT"
          echo "signing_mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

          {
            echo "## JEE AEGIS Android APK Build Summary (v${VERSION_NAME})"
            echo "- **Source Commit SHA**: \`${COMMIT_SHA}\` (\`${SHORT_SHA}\`)"
            echo "- **Version**: \`${VERSION_NAME}\` (\`versionCode = ${VERSION_CODE}\`)"
            echo "- **Package**: \`ng.jee.aegis.connector\`"
            echo "- **Production Backend**: \`https://jee-aegis.onrender.com\`"
            echo "- **Build Variant**: \`$BUILD_LABEL\`"
            echo "- **Signing Mode**: \`$SIGNING_MODE\`"
            echo "- **Firebase Status**: $FB_STATUS"
            echo "- **Source APK**: \`$APK_SOURCE\`"
            echo "- **Artifact Name**: \`JEE-AEGIS-apk\` (\`jee-aegis.apk\`)"
            echo "- **Size**: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
            echo "- **SHA256 Checksum**: \`${SHA256}\`"
            echo "- **Publish to apk-latest Release**: \`${SHOULD_PUBLISH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JEE-AEGIS-apk
          path: public/downloads/jee-aegis.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK to GitHub Release (Explicit workflow_dispatch Only)
        if: steps.verify_apk.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="apk-latest"
          APK_FILE="public/downloads/jee-aegis.apk"
          VERSION_NAME="${{ steps.verify_apk.outputs.version_name }}"
          VERSION_CODE="${{ steps.verify_apk.outputs.version_code }}"
          COMMIT_SHA="${{ steps.verify_apk.outputs.commit_sha }}"
          SHORT_SHA="${{ steps.verify_apk.outputs.short_sha }}"
          SIZE_BYTES="${{ steps.verify_apk.outputs.size_bytes }}"
          SIZE_MB="${{ steps.verify_apk.outputs.size_mb }}"
          SHA256="${{ steps.verify_apk.outputs.sha256 }}"
          BUILD_LABEL="${{ steps.verify_apk.outputs.build_label }}"
          SIGNING_MODE="${{ steps.verify_apk.outputs.signing_mode }}"
          FB_STATUS="${{ steps.firebase_config.outputs.firebase_status }}"

          TITLE="JEE AEGIS Android Connector APK v${VERSION_NAME} (build ${VERSION_CODE})"
          NOTES="Automated JEE AEGIS Android Connector APK v${VERSION_NAME} (versionCode=${VERSION_CODE}, commit=${SHORT_SHA}, ${BUILD_LABEL}, ${SIZE_MB} MB, sha256=${SHA256}). Signing: ${SIGNING_MODE}. Firebase Status: ${FB_STATUS}."

          echo "Retargeting Git tag '$TAG' to commit $COMMIT_SHA..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$COMMIT_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing GitHub Release '$TAG'..."
            gh release delete-asset "$TAG" jee-aegis.apk --yes >/dev/null 2>&1 || true
            gh release delete-asset "$TAG" JEE-AEGIS.apk --yes >/dev/null 2>&1 || true
            gh release upload "$TAG" "${APK_FILE}#jee-aegis.apk" --clobber
            gh release edit "$TAG" \
              --target "$COMMIT_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            echo "Creating new GitHub Release '$TAG'..."
            gh release create "$TAG" "${APK_FILE}#jee-aegis.apk" \
              --target "$COMMIT_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          echo "Verifying published asset on GitHub Release '$TAG'..."
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          REMOTE_SIZE="$(printf '%s' "$RELEASE_JSON" | python3 -c "import sys, json; data=json.load(sys.stdin); assets=[a for a in data.get('assets', []) if a.get('name')=='jee-aegis.apk' and a.get('state')=='uploaded']; print(assets[0]['size'] if assets else 0)")"
          REMOTE_DIGEST="$(printf '%s' "$RELEASE_JSON" | python3 -c "import sys, json; data=json.load(sys.stdin); assets=[a for a in data.get('assets', []) if a.get('name')=='jee-aegis.apk' and a.get('state')=='uploaded']; print(assets[0].get('digest') or '' if assets else '')")"

          if [ "$REMOTE_SIZE" != "$SIZE_BYTES" ]; then
            echo "::error::Release asset size mismatch! Expected ${SIZE_BYTES} bytes, but GitHub Release asset has ${REMOTE_SIZE} bytes."
            exit 1
          fi

          if [ -n "$REMOTE_DIGEST" ] && [ "$REMOTE_DIGEST" != "sha256:${SHA256}" ]; then
            echo "::error::Release asset SHA256 mismatch! Expected sha256:${SHA256}, but GitHub Release asset has ${REMOTE_DIGEST}."
            exit 1
          fi

          echo "Successfully published and verified jee-aegis.apk (v${VERSION_NAME}, versionCode=${VERSION_CODE}, commit=${SHORT_SHA}, size=${REMOTE_SIZE} bytes, sha256=${SHA256})."

      - name: Collect Build Failure Diagnostics
        if: failure()
        run: |
          echo "::warning::Android APK build failed. Inspecting Gradle reports..."
          find android -name "*.txt" -o -name "*.html" | grep "build/reports" || true
